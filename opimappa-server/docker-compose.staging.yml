# Override staging — usare SEMPRE insieme al compose principale:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml ...
# Aggiunge api-staging + minio-staging ed estende caddy con il mount web-staging.
# La rete (opimappa_net) e gli altri servizi arrivano dal compose base (progetto "opimappa").
services:
  # Object Storage MinIO staging (console host 9002 per non collidere con prod 9001)
  minio-staging:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: opimappa-minio-staging
    restart: unless-stopped
    env_file: /opt/opimappa/.env.staging
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9002:9001"
    volumes:
      - /opt/opimappa/data/minio-staging:/data
    networks:
      opimappa_net:
        aliases:
          - minio-staging
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # API staging — riusa l'immagine prod opimappa-api:latest con env staging.
  # (Per testare modifiche all'API del branch, il runner ricostruirà un'immagine dedicata.)
  api-staging:
    image: opimappa-api:latest
    container_name: opimappa-api-staging
    restart: unless-stopped
    env_file: /opt/opimappa/.env.staging
    depends_on:
      minio-staging:
        condition: service_healthy
    networks:
      opimappa_net:
        aliases:
          - api-staging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Estensione del caddy del compose base: aggiunge SOLO il mount della build staging
  # (i volumi in override sono additivi) e corregge l'healthcheck su :80 (caddy ascolta :80).
  caddy:
    volumes:
      - /opt/opimappa/web-staging:/srv/web-staging:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
