name: Deploy Staging API

on:
  push:
    # Solo se cambia il codice API: evita rebuild/restart inutili a ogni push frontend.
    branches:
      - 'feature/**'
    paths:
      - 'opimappa-server/api/**'
  workflow_dispatch:

concurrency:
  group: staging-api
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: opimappa-server/api/package-lock.json

      # Builda l'immagine opimappa-api:staging e ricrea api-staging.
      # Richiede la entry sudoers NOPASSWD per il comando compose (vedi script).
      - name: Build & deploy API
        run: bash scripts/deploy-staging-api.sh
